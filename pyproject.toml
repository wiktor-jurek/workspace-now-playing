[project]
name = "workspace-now-playing"
version = "0.1.0"
description = "Show what you're playing on Spotify as your Google Chat status."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # 47+ aarch64 wheels crash with SIGILL on some ARM hosts (e.g. Docker on Apple Silicon)
    "cryptography>=43,<47",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "uvicorn[standard]>=0.32",
]
